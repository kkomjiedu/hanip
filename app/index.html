<title>한입씩 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="assets/rice.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Gaegu:wght@300;400&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 폰 한 화면 앱. 데스크톱에서는 가운데 430px 기둥, 하단 탭 고정. 브랜드가 밝은 한 가지 톤이라 라이트 단일 테마. */
:root {
  --milk: #FBF8F2; --butter: #F6EBD0; --sage: #9DBE92; --deep: #5F7A5C; --apricot: #E9A58C;
  --rose: #EFCFCB; --mist: #CFDFE4; --ink: #4A443F; --soft: #6B6358; --line: #ECE5D8;
  --sage-tint: #E4ECDF; --peach-tint: #F8E4DA; --oat: #F1ECE2; --white: #FFFFFF;
  --warn-ink: #9A3F1C; --warn-bg: #F8E4DA; --ok-ink: #3F5C3C; --emergency: #B3261E;
  --f-display: 'Gowun Batang', 'Noto Serif KR', serif;
  --f-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-hand: 'Gaegu', 'Gowun Dodum', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--oat); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: var(--ink); }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2.5px solid var(--deep); outline-offset: 2px; }
a { color: var(--deep); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }

.app { max-width: 430px; height: 100%; margin: 0 auto; background: var(--milk); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 0 1px var(--line); }
.top { flex: none; display: flex; align-items: center; gap: 8px; min-height: 56px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.top h1 { font-size: 20px; flex: 1; text-align: center; }
.top .logo { height: 28px; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; flex: none; position: relative; }
.icon-btn .count { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--apricot); color: var(--ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 4px; }
.screen { flex: 1; min-height: 0; overflow-y: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 4px 24px; display: flex; flex-direction: column; gap: 16px; }
.tabs { flex: none; display: flex; border-top: 1.5px solid var(--line); background: var(--milk); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { flex: 1; min-height: 60px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 500; color: var(--soft); }
.tab[aria-current="page"] { color: var(--deep); }
.tab svg { width: 24px; height: 24px; }

.badge { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 500; background: var(--oat); color: var(--ink); white-space: nowrap; }
.badge.rose { background: var(--rose); } .badge.mist { background: var(--mist); } .badge.butter { background: var(--butter); }
.badge.sage { background: var(--sage-tint); color: var(--ok-ink); } .badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
.badge.deep { background: var(--deep); color: var(--white); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.muted { color: var(--soft); font-size: 13px; }
.sec-title { font-family: var(--f-display); font-size: 19px; }
.btn { min-height: 48px; border: 0; border-radius: 24px; padding: 0 20px; background: var(--deep); color: var(--white); font-weight: 500; font-size: 15.5px; }
.btn.ghost { background: var(--white); color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--white); color: var(--warn-ink); border: 1.5px solid var(--warn-bg); }
.btn.small { min-height: 40px; font-size: 14px; padding: 0 16px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1.5px solid var(--line); background: var(--white); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--white); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips .chip { flex: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.tag-x { display: inline-flex; align-items: center; gap: 2px; min-height: 36px; padding: 0 4px 0 12px; border-radius: 18px; background: var(--sage-tint); font-size: 14px; font-weight: 500; }
.tag-x button { width: 30px; height: 30px; border: 0; background: none; border-radius: 50%; }

.card { border: 1.5px solid var(--line); border-radius: 20px; background: var(--white); padding: 14px; }
.note { border-radius: 16px; padding: 12px 14px; font-size: 13.5px; line-height: 1.55; display: flex; gap: 10px; align-items: flex-start; }
.note > span { min-width: 0; }
.note.warn { background: var(--warn-bg); color: #6E3A22; }
.note.sage { background: var(--sage-tint); }
.note.mist { background: var(--mist); }
.note.emergency { background: var(--emergency); color: var(--white); font-weight: 500; }
.note svg { flex: none; margin-top: 2px; }
.example-bar { flex: none; background: var(--butter); font-size: 12.5px; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.example-bar button { border: 0; background: none; color: var(--deep); font-weight: 600; font-size: 12.5px; min-height: 32px; text-decoration: underline; }

.char { display: grid; place-items: center; border-radius: 16px; flex: none; }
.char img { width: 78%; height: 78%; object-fit: contain; }
/* 캐릭터 그림이 없는 재료: 첫 글자를 원 한가운데에. 본문 글꼴은 위아래 여백이 고르게 잡혀 가운데에 놓인다 */
.char .dot { width: 72%; height: 72%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--f-body); font-weight: 600; line-height: 1; color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(74, 68, 63, .08); }

.rlist { display: flex; flex-direction: column; gap: 8px; }
.ritem { width: 100%; display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--white); padding: 8px 12px 8px 8px; text-align: left; }
.ritem .t { font-family: var(--f-display); font-size: 16.5px; display: block; line-height: 1.3; }
.ritem .m { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.ritem > span:nth-child(2) { flex: 1; min-width: 0; }

.kidbar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.kid { flex: none; min-height: 42px; padding: 0 14px 0 5px; border-radius: 21px; border: 1.5px solid var(--line); background: var(--white); display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; }
.kid[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--white); }
.kid .char { width: 32px; height: 32px; border-radius: 50%; background: var(--milk); }

.banner { border-radius: 22px; background: var(--butter); padding: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.banner .pill { align-self: flex-start; }
.banner h2 { font-size: 20px; padding-right: 76px; }
.banner p { font-size: 13.5px; padding-right: 76px; }
.banner img.deco { position: absolute; right: -6px; top: 8px; width: 88px; transform: rotate(10deg); }
.banner.warn { background: var(--warn-bg); }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick button { border: 0; border-radius: 20px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 500; font-size: 13.5px; }
.quick img { width: 44px; height: 44px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lb { font-size: 14px; font-weight: 500; }
.input { min-height: 48px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--white); padding: 0 14px; width: 100%; font-size: 16px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; min-height: 46px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--white); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--white); }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--milk); font-size: 20px; }
.stepper output { font-family: var(--f-display); font-size: 24px; min-width: 28px; text-align: center; }
.amount { display: flex; gap: 6px; }
.amount input { width: 84px; min-height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--white); text-align: center; font-size: 16px; }
.amount select { min-height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--white); padding: 0 8px; }

.hero { border-radius: 24px; background: var(--butter); position: relative; overflow: hidden; height: 220px; }
.hero img { position: absolute; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv > div { border-radius: 16px; padding: 11px 13px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kv b { font-size: 12.5px; }
.kv span { font-size: 13.5px; line-height: 1.5; }
.list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.src { font-size: 12px; color: var(--soft); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.src a { color: var(--soft); }
.empty { text-align: center; padding: 28px 12px; color: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty img { width: 72px; }
details.card > summary, details.fold > summary { cursor: pointer; font-weight: 500; min-height: 32px; display: flex; align-items: center; gap: 8px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: '＋'; margin-left: auto; color: var(--soft); }
details[open] > summary::after { content: '－'; }
details.fold { border-top: 1.5px solid var(--line); padding-top: 8px; }
.hand { font-family: var(--f-hand); font-size: 20px; color: var(--deep); }
.kidfit { display: flex; flex-direction: column; gap: 6px; }
.kidfit > div { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.kidfit b { flex: none; min-width: 44px; }
.search { min-height: 46px; border-radius: 23px; background: var(--oat); border: 0; padding: 0 16px; width: 100%; font-size: 15px; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 40px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--deep); margin: 0; flex: none; }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px 6px; }
.ig { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; padding: 0; }
.ig .char { width: 60px; height: 60px; border-radius: 20px; background: var(--sage-tint); position: relative; }
.ig[aria-pressed="true"] .char { background: var(--white); box-shadow: inset 0 0 0 2.5px var(--deep); }
.status { font-size: 12.5px; font-weight: 500; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1.5px solid var(--line); }
.check input { width: 24px; height: 24px; accent-color: var(--deep); margin: 2px 0 0; flex: none; }
.check label { flex: 1; min-width: 0; cursor: pointer; }
.check b { font-weight: 500; display: block; }
.compare { display: grid; grid-template-columns: 1fr; gap: 10px; }
.compare .card h3 { font-size: 18px; }
.plist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
.plist li { display: flex; gap: 6px; }
.plist li::before { content: attr(data-m); flex: none; font-weight: 600; }
.steps-nav { display: grid; grid-template-columns: 1fr; gap: 8px; }
.steps-nav button { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--white); padding: 12px 14px; text-align: left; }
.steps-nav .num { width: 30px; height: 30px; border-radius: 50%; background: var(--deep); color: var(--white); font-weight: 600; display: grid; place-items: center; flex: none; }
.cal { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.cal button { aspect-ratio: 1 / 1.08; max-width: 100%; border: 1.5px solid var(--line); border-radius: 14px; background: var(--white); padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font-size: 12px; position: relative; }
.cal button .d { font-weight: 600; font-variant-numeric: tabular-nums; }
.cal button .ic { width: 26px; height: 26px; }
.cal button.done { background: var(--sage-tint); border-color: var(--sage-tint); }
.cal button.today { box-shadow: 0 0 0 2.5px var(--apricot); }
.cal button[aria-pressed="true"] { border-color: var(--deep); box-shadow: inset 0 0 0 1.5px var(--deep); }
.cal button.new::after { content: '새'; position: absolute; top: 3px; right: 4px; font-size: 10px; font-weight: 600; color: var(--warn-ink); }
.cal button.sus { background: var(--warn-bg); }
.mtabs { display: flex; gap: 6px; background: var(--oat); border-radius: 16px; padding: 4px; }
.mtabs button { flex: 1; min-height: 40px; border: 0; border-radius: 12px; background: none; font-weight: 500; font-size: 14px; }
.mtabs button[aria-pressed="true"] { background: var(--white); box-shadow: 0 1px 2px rgba(74, 68, 63, .12); }
.pref { display: grid; gap: 8px; }
.pref button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--white); padding: 12px 14px; text-align: left; }
.pref button b { font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.pref button[aria-pressed="true"] { border-color: var(--deep); background: var(--sage-tint); }
.alert-item { display: flex; gap: 12px; align-items: flex-start; }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cats .ig { background: var(--white); border: 1.5px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .ritem, .ig, .chip, .btn, .cal button { transition: transform .12s ease; } .ritem:active, .ig:active, .chip:active, .btn:active, .cal button:active { transform: scale(.98); } }
</style>

<div class="app" id="app">
  <div class="example-bar" id="exampleBar" hidden>
    <span>예시 가족으로 보고 있어요</span>
    <button type="button" id="startOwn">우리 아이로 시작</button>
  </div>
  <header class="top" id="top"></header>
  <main class="screen" id="screen" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="하단 메뉴"></nav>
</div>

<script>
/** @typedef {import('./types').Recipe} Recipe */
/** @typedef {import('./types').RecipeMethods} RecipeMethods */
/** @typedef {import('./types').Guide} Guide */
/** @typedef {import('./types').AllergenPolicy} AllergenPolicy */
/** @typedef {import('./types').Source} Source */
/** @typedef {import('./types').Kid} Kid */
/** @typedef {import('./types').AppState} AppState */
/** @typedef {import('./types').AllergenStatus} AllergenStatus */
/** @typedef {import('./types').MethodId} MethodId */

(() => {
  'use strict';
  /** @type {(s: string, el?: ParentNode) => any} */
  const $ = (s, el = document) => el.querySelector(s);
  /** @param {unknown} s */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => /** @type {Record<string,string>} */ ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const TODAY = new Date();
  TODAY.setHours(12, 0, 0, 0);
  /** @param {Date} d */
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  /** @param {string} s */
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  /** @param {Date} d @param {number} n */
  const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
  /** @param {Date} d @param {number} n */
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  /** @param {string} a @param {string} b */
  const daysBetween = (a, b) => Math.round((parse(b).getTime() - parse(a).getTime()) / 86400000);
  const todayIso = iso(TODAY);
  /** @param {string} date */
  const daysSince = (date) => daysBetween(date, todayIso);
  /** 한글 등 입력기가 글자를 조합하는 중인지 (조합 중 Enter는 글자 확정용이라 무시) @param {KeyboardEvent} e */
  const imeBusy = (e) => e.isComposing || e.keyCode === 229;
  /** 마지막 호출 뒤 ms만큼 조용하면 한 번 실행 @param {() => void} fn @param {number} ms */
  const debounce = (fn, ms) => { /** @type {ReturnType<typeof setTimeout>|undefined} */ let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; };
  /** @param {string} birth */
  const monthsOld = (birth) => {
    const b = parse(birth); let m = (TODAY.getFullYear() - b.getFullYear()) * 12 + (TODAY.getMonth() - b.getMonth());
    if (TODAY.getDate() < b.getDate()) m -= 1; return Math.max(0, m);
  };
  /** @param {string} s */
  const fmtDate = (s) => { const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };

  // ---------- 데이터 ----------
  /** @type {Recipe[]} */ let RECIPES = [];
  /** @type {Record<string, RecipeMethods>} */ let METHODS = {};
  /** @type {any[]} */ let GUIDE_ROWS = [];
  /** @type {{ items: any[], sources: Record<string, {title: string, url: string}> }} */ let RISKS = { items: [], sources: {} };
  /** @type {any[]} */ let SITUATIONS = [];
  /** @type {Guide} */ let GUIDE;
  /** @type {AllergenPolicy} */ let POLICY;
  /** @type {Record<string, Source>} */ let SOURCES = {};
  /** @type {import('./types').StorageGuide} */ let STORAGE;

  const CATS = [
    { key: '첫한입_초기', label: '초기', group: '첫한입', color: 'rose' },
    { key: '첫한입_중기', label: '중기', group: '첫한입', color: 'rose' },
    { key: '첫한입_후기', label: '후기', group: '첫한입', color: 'rose' },
    { key: '첫한입_완료기', label: '완료기', group: '첫한입', color: 'rose' },
    { key: '쑥쑥한입', label: '쑥쑥한입', group: '쑥쑥한입', color: 'mist' },
    { key: '같이한입', label: '같이한입', group: '같이한입', color: 'butter' },
  ];
  /** @param {string} k */
  const catOf = (k) => CATS.find((c) => c.key === k) ?? { key: k, label: k, group: k, color: '' };
  /** @type {Record<string, string>} */
  const CHAR = { 쌀: 'rice', 당근: 'carrot', 브로콜리: 'broccoli', 애호박: 'zucchini', 고구마: 'sweet-potato', 단호박: 'kabocha', 배: 'pear', 버섯: 'mushroom', 달걀: 'egg', 메추리알: 'egg', 사과: 'apple' };
  /** @type {Record<string, string>} */
  const INGREDIENT_ALLERGEN = { 달걀: '계란', 메추리알: '계란', 두부: '대두', 콩나물: '대두', 연어: '생선', 대구: '생선', 고등어: '생선', 흰살생선: '생선', 북어: '생선', 새우: '갑각류', 파스타: '밀', 밀: '밀', 오트밀: '밀', 요거트: '우유', 치즈: '우유', 땅콩: '땅콩', 참깨: '참깨', 들깨: '들깨' };
  const TINTS = ['#F7E6E2', '#F6EBD0', '#E4ECDF', '#DCE8EC', '#F8E4DA', '#F1ECE2'];
  /** @param {string} s */
  const tintFor = (s) => TINTS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % TINTS.length];
  /** @param {string} ing @param {number} [size] @param {string} [bg] */
  function charHtml(ing, size = 52, bg) {
    const file = CHAR[ing];
    const inner = file ? `<img src="assets/${file}.svg" alt="">` : `<span class="dot" style="background:${tintFor(ing + 'x')};font-size:${Math.max(11, Math.round(size * 0.34))}px" aria-hidden="true">${esc(String(ing).slice(0, 1))}</span>`;
    return `<span class="char" style="width:${size}px;height:${size}px;background:${bg ?? tintFor(ing)}">${inner}</span>`;
  }
  /** @param {Recipe} r */
  const leadIngredient = (r) => r.main_ingredients.find((i) => CHAR[i] && i !== '쌀') ?? r.main_ingredients.find((i) => i !== '쌀') ?? r.main_ingredients[0] ?? '';

  // 출처: 위험 재료 파일은 url, 가이드·정책은 키로 가리킨다
  /** @param {string[]} keys @param {{ status?: string }} [opt] */
  function cite(keys, opt = {}) {
    const links = keys.map((k) => {
      const s = SOURCES[k];
      if (s) return s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.org.split(' (')[0])}</a>` : `<span>${esc(s.org)}</span>`;
      const r = Object.values(RISKS.sources).find((x) => x.url === k) ?? RISKS.sources[k];
      if (r) return /^https?:/.test(r.url) ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title.split('·')[0].trim())}</a>` : `<span>${esc(r.title.split('(')[0].trim())}</span>`;
      return /^https?:/.test(k) ? `<a href="${esc(k)}" target="_blank" rel="noopener">출처</a>` : '';
    }).join('');
    const tag = opt.status === 'source_verified' ? '<span class="badge" style="min-height:20px">원문 확인 · 전문가 감수 전</span>' : '';
    return keys.length ? `<div class="src">${links}<span>확인 2026-10-18</span>${tag}</div>` : '';
  }

  const ICON = {
    back: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5L8 12L15 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chev: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L16 12L9 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 7.5V13M12 16.2V16.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    bell: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11C6 7.7 8.7 5 12 5C15.3 5 18 7.7 18 11V17L19.5 18.5H4.5Z M10 21H14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    x: '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    home: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11L12 4L20 11V20H14V14H10V20H4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    plan: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10H20M9 3V7M15 3V7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    ingredients: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 10H18M9 6V8M9 13V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    recipes: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4H17A2 2 0 0 1 19 6V20H7A2 2 0 0 1 5 18Z M9 8H15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    kids: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20C5 15.5 8 14 12 14C16 14 19 15.5 19 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  };

  // ---------- 상태 (이 브라우저에만 저장) ----------
  const KEY = 'hanip-prototype-v2';
  /** @returns {Kid['risk']} */
  const emptyRisk = () => ({ eczema: null, foodAllergy: null, reaction: null, medicalPlan: null });
  /** @param {Partial<Kid>} k @returns {Kid} */
  function kidDefaults(k) {
    return {
      id: k.id ?? 'k' + Date.now().toString(36), name: k.name ?? '', birth: k.birth ?? '', started: k.started ?? false, startDate: k.startDate ?? '',
      allergies: k.allergies ?? [], risk: k.risk ?? emptyRisk(), allergen: k.allergen ?? {}, foods: k.foods ?? {}, suspectedFoods: k.suspectedFoods ?? {},
      plan: k.plan ?? { interval: 3, offset: 0, pausedAt: null, records: {} },
    };
  }
  /** @returns {AppState} */
  function exampleState() {
    const start1 = iso(addDays(TODAY, -21));
    /** @type {Record<string, import('./types').DayRecord>} */
    const records = {};
    for (let d = 1; d <= 21; d++) records[d] = { done: true };
    const k1 = kidDefaults({
      id: 'k1', name: '콩이', birth: iso(addDays(addMonths(TODAY, -6), -14)), started: true, startDate: start1,
      risk: { eczema: false, foodAllergy: false, reaction: false, medicalPlan: false },
      allergen: { 계란: { status: 'introducing', first: iso(addDays(TODAY, -3)), last: iso(addDays(TODAY, -3)), log: [{ date: iso(addDays(TODAY, -3)), ok: true }] } },
      plan: { interval: 3, offset: 0, pausedAt: null, records },
    });
    const k2 = kidDefaults({
      id: 'k2', name: '별이', birth: iso(addMonths(TODAY, -28)), started: true, startDate: iso(addMonths(TODAY, -22)), allergies: ['계란'],
      risk: { eczema: false, foodAllergy: true, reaction: false, medicalPlan: true },
      allergen: {
        우유: { status: 'tried', first: iso(addMonths(TODAY, -15)), last: iso(addDays(TODAY, -10)), log: [{ date: iso(addDays(TODAY, -10)), ok: true }] },
        밀: { status: 'tried', first: iso(addMonths(TODAY, -14)), last: iso(addDays(TODAY, -2)), log: [{ date: iso(addDays(TODAY, -2)), ok: true }] },
        계란: { status: 'consult', first: null, last: null, log: [] },
      },
    });
    const fridge = [['소고기', 1], ['애호박', 3], ['달걀', 10], ['요거트', 5], ['두부', 0], ['브로콜리', 2]].map(([name, ago], i) => ({ id: 'f' + i, name: String(name), bought: iso(addDays(TODAY, -Number(ago))) }));
    return { v: 2, example: true, adults: 2, selected: 'k1', prefs: { method: 'topping' }, today: { date: todayIso, items: ['소고기', '애호박', '감자'], riceAtHome: true, family: false }, fridge, kids: [k1, k2] };
  }
  /** @returns {AppState} */
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) ?? 'null');
      if (s && s.v === 2 && Array.isArray(s.kids) && s.kids.length) { s.kids = s.kids.map(kidDefaults); s.fridge ??= []; return s; }
      const old = JSON.parse(localStorage.getItem('hanip-prototype-v1') ?? 'null');
      if (old && Array.isArray(old.kids) && old.kids.length && !old.example) {
        return {
          v: 2, example: false, adults: old.adults ?? 2, selected: old.selected, prefs: { method: 'both' }, today: { date: todayIso, items: [], riceAtHome: true, family: false }, fridge: [],
          kids: old.kids.map((/** @type {any} */ k) => kidDefaults({
            ...k,
            allergen: Object.fromEntries(Object.entries(k.tried ?? {}).map(([a, d]) => [a, { status: 'tried', first: String(d), last: String(d), log: [{ date: String(d), ok: true }] }])),
          })),
        };
      }
    } catch (e) { /* 저장소를 못 쓰면 예시로 시작 */ }
    return exampleState();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 무시 */ } }
  let state = load();
  if (state.today.date !== todayIso) state.today = { date: todayIso, items: [], riceAtHome: state.today.riceAtHome, family: state.today.family };
  /** @param {string} id */
  const kidById = (id) => state.kids.find((k) => k.id === id);
  const currentKid = () => kidById(state.selected) ?? state.kids[0];

  // ---------- 규칙 ----------
  /** @param {Kid} kid */
  function stageLabel(kid) {
    if (!kid.birth) return '';
    const m = monthsOld(kid.birth);
    if (m < 12 && !kid.started) return '이유식 시작 전';
    if (m < 7) return '첫한입 · 초기'; if (m < 9) return '첫한입 · 중기'; if (m < 12) return '첫한입 · 후기';
    if (m < 18) return '첫한입 · 완료기'; if (m < 24) return '쑥쑥한입 · 유아식'; if (m < 36) return '쑥쑥한입 · 작은아이';
    if (m < 60) return '쑥쑥한입 · 큰아이'; return '같이한입';
  }
  /** @param {Kid} kid @param {string} key @returns {import('./types').AllergenRecord} */
  const allergenRec = (kid, key) => kid.allergen[key] ?? { status: kid.allergies.includes(key) ? 'consult' : 'not_tried', first: null, last: null, log: [] };
  /** @param {Kid} kid 피해야 하는 알레르기: 등록한 알레르기 + 반응 의심 + 상담 필요 */
  const avoidSet = (kid) => new Set([...kid.allergies, ...Object.entries(kid.allergen).filter(([, r]) => r.status === 'suspected' || r.status === 'consult').map(([k]) => k)]);
  /** @param {Recipe} r */
  const recipeAllergens = (r) => [...r.allergens, ...r.possible_allergens.map((p) => p.allergen)];
  /** @param {Kid} kid */
  const isHighRisk = (kid) => POLICY.riskQuestions.some((q) => q.highRisk && kid.risk[q.id] === true);
  /** @param {Kid} kid */
  const riskAnswered = (kid) => POLICY.riskQuestions.every((q) => kid.risk[q.id] !== null);
  /** @param {string} k */
  const allergenLabel = (k) => POLICY.allergens.find((a) => a.key === k)?.label ?? k;
  /** @param {AllergenStatus} s */
  const statusOf = (s) => POLICY.statuses.find((x) => x.id === s) ?? POLICY.statuses[0];
  /** @param {string} tone */
  const toneClass = (tone) => ({ ok: 'sage', warn: 'warn', butter: 'butter' })[tone] ?? '';

  /** 아이에게 맞지 않는 이유 하나 (null이면 먹을 수 있음) @param {Recipe} r @param {Kid} kid */
  function unfitReason(r, kid) {
    const m = monthsOld(kid.birth);
    if (m < 12 && !kid.started) return '아직 이유식 시작 전이에요';
    if (r.min_months > m) return `${r.min_months}개월부터예요`;
    const avoid = avoidSet(kid);
    const hit = recipeAllergens(r).filter((a) => avoid.has(a));
    if (hit.length) {
      const sure = hit.filter((a) => r.allergens.includes(a));
      return sure.length ? `${sure.map(allergenLabel).join('·')} 피하기` : `${hit.map(allergenLabel).join('·')}가 들어갈 수 있어요`;
    }
    const sus = r.main_ingredients.filter((i) => kid.suspectedFoods[i]);
    if (sus.length) return `${sus.join('·')} 반응 의심`;
    return null;
  }
  /** @param {Recipe} r @param {Kid} kid */
  const firstTimeAllergens = (r, kid) => r.allergens.filter((a) => POLICY.allergens.some((x) => x.key === a) && allergenRec(kid, a).status === 'not_tried');
  /** @param {Kid} kid */
  const fitRecipes = (kid) => RECIPES.filter((r) => !unfitReason(r, kid));

  // ---------- 첫 30일 식단 ----------
  /** @param {Kid} kid 오늘이 며칠째인지 (멈춘 동안은 멈춘 날에 고정) */
  function planDayNumber(kid, date = todayIso) {
    if (!kid.started || !kid.startDate) return null;
    const until = kid.plan.pausedAt && date > kid.plan.pausedAt ? kid.plan.pausedAt : date;
    return daysBetween(kid.startDate, until) + 1 - kid.plan.offset;
  }
  /** @param {Kid} kid */
  const planOrder = (kid) => GUIDE.first30.ingredientOrder.filter((i) => !kid.suspectedFoods[i]);
  /** @param {Kid} kid @param {number} day */
  function planDate(kid, day) {
    if (!kid.startDate) return null;
    const d = iso(addDays(parse(kid.startDate), day - 1 + kid.plan.offset));
    if (kid.plan.pausedAt && d > kid.plan.pausedAt) return null;
    return d;
  }
  /** 그날의 새 재료·먹어 본 재료·추천 레시피 @param {Kid} kid @param {number} day */
  function planFor(kid, day) {
    const order = planOrder(kid);
    const n = kid.plan.interval;
    const block = Math.floor((day - 1) / n);
    if (block >= order.length) return { day, block, newIng: null, isNewDay: false, dayInBlock: 0, known: order, recipe: null };
    const newIng = order[block];
    const known = order.slice(0, block + 1);
    const m = monthsOld(kid.birth);
    const cands = RECIPES.filter((r) => r.category === '첫한입_초기' && r.min_months <= Math.max(m, 6) && r.main_ingredients.includes(newIng)
      && r.main_ingredients.every((i) => known.includes(i)) && !unfitReason(r, { ...kid, birth: kid.birth, started: true }))
      .sort((a, b) => a.main_ingredients.length - b.main_ingredients.length);
    const dayInBlock = ((day - 1) % n) + 1;
    const recipe = cands.length ? cands[(dayInBlock - 1) % cands.length] : null;
    return { day, block, newIng, isNewDay: dayInBlock === 1, dayInBlock, known, recipe };
  }

  // ---------- 알림 (앱 안에서만) ----------
  /** @param {Kid} kid */
  function alertsFor(kid) {
    /** @type {{ tone: string, title: string, body: string, go?: [string, string|null], src?: string[] }[]} */
    const out = [];
    for (const [k, r] of Object.entries(kid.allergen)) {
      if (r.status === 'suspected') out.push({ tone: 'warn', title: `${allergenLabel(k)} 반응 의심`, body: '다시 먹이지 말고 소아청소년과와 상의해 주세요.', go: ['allergen', k], src: POLICY.afterReaction.sources });
    }
    for (const [ing, d] of Object.entries(kid.suspectedFoods)) out.push({ tone: 'warn', title: `${ing} 반응 의심 (${fmtDate(d)})`, body: '식단에서 뺐어요. 새 재료 도입은 의료진과 상담한 뒤 다시 시작해 주세요.', go: ['plan', null] });
    if (!riskAnswered(kid) && monthsOld(kid.birth) >= 4) out.push({ tone: 'butter', title: '알레르기 위험도를 확인해 주세요', body: '알레르기 식품을 시작하기 전에 네 가지 질문에 답해 주세요.', go: ['risk', null] });
    for (const [k, r] of Object.entries(kid.allergen)) {
      if ((r.status === 'tried' || r.status === 'introducing') && r.last && daysSince(r.last) >= POLICY.repeatIntervalDays && !isHighRisk(kid)) {
        out.push({ tone: 'butter', title: `${allergenLabel(k)}를 ${daysSince(r.last)}일째 안 먹었어요`, body: `마지막 섭취 ${fmtDate(r.last)}. 잘 먹은 알레르기 식품은 최소 주 1회 계속 주는 것이 좋아요(ASCIA).`, go: ['allergen', k], src: [POLICY.repeatIntervalSource] });
      }
    }
    const m = monthsOld(kid.birth);
    const introducing = Object.entries(kid.allergen).find(([, r]) => r.status === 'introducing');
    if (kid.started && m >= 6 && riskAnswered(kid) && !isHighRisk(kid) && !introducing) {
      const next = [...POLICY.allergens].sort((a, b) => a.order - b.order).find((a) => allergenRec(kid, a.key).status === 'not_tried');
      if (next && m < 24) out.push({ tone: 'sage', title: `다음 알레르기 식품: ${next.label}`, body: '이유식에 적응했다면 늦추지 않아요. 한 끼에 하나씩, 적은 양부터.', go: ['allergen', next.key], src: ['NHS_ALLERGY', 'ASCIA_2026'] });
    }
    if (isHighRisk(kid) && !kid.risk.medicalPlan) out.push({ tone: 'warn', title: '의료진 상담을 먼저 받아 주세요', body: POLICY.highRiskMessage, go: ['allergy', null] });
    return out;
  }

  // ---------- 화면 이동 ----------
  /** @type {{ name: string, arg: string|null }} */
  let view = { name: 'home', arg: null };
  /** @type {{ name: string, arg: string|null }[]} */
  const history = [];
  /** @type {Record<string, string>} */
  const TAB_OF = { home: 'home', alerts: 'home', today: 'home', myfridge: 'ingredients', recipes: 'recipes', recipe: 'recipes', guide: 'recipes', readiness: 'recipes', stages: 'recipes', faq: 'recipes', methods: 'recipes', ingredients: 'ingredients', ingredient: 'ingredients', fridge: 'ingredients', family: 'recipes', allergy: 'kids', allergen: 'kids', risk: 'kids', situations: 'home', situation: 'home', kids: 'kids', kidEdit: 'kids', plan: 'plan' };
  /** @param {string} name @param {string|null} [arg] @param {{ replace?: boolean }} [opt] */
  function go(name, arg = null, opt = {}) { if (!opt.replace) history.push(view); view = { name, arg }; render(); $('#screen').scrollTop = 0; $('#screen').focus({ preventScroll: true }); }
  function back() { view = history.pop() ?? { name: 'home', arg: null }; render(); }
  /** @param {string} name */
  function tabGo(name) { history.length = 0; view = { name, arg: null }; render(); $('#screen').scrollTop = 0; }
  const TABS = [['home', '홈'], ['plan', '식단표'], ['ingredients', '재료'], ['recipes', '레시피'], ['kids', '우리 아이']];

  /** @type {Record<string, (t: HTMLElement, e: Event) => void>} */
  const handlers = {};
  let hid = 0;
  /** @param {(t: HTMLElement, e: Event) => void} fn */
  const on = (fn) => { const k = 'h' + (++hid); handlers[k] = fn; return k; };

  /** @type {Record<string, (arg: any) => { title?: string, top?: string, html: string, after?: () => void }>} */
  const SCREENS = {};

  function render() {
    for (const k of Object.keys(handlers)) delete handlers[k];
    const onboarding = view.name === 'onboard';
    $('#exampleBar').hidden = !state.example || onboarding;
    $('#tabs').hidden = onboarding;
    $('#tabs').innerHTML = TABS.map(([k, l]) => `<button type="button" class="tab" data-tab="${k}" ${TAB_OF[view.name] === k ? 'aria-current="page"' : ''}>${/** @type {any} */ (ICON)[k]}${l}</button>`).join('');
    const out = (SCREENS[view.name] ?? SCREENS.home)(view.arg);
    const nAlerts = alertsFor(currentKid()).length;
    $('#top').innerHTML = out.top ?? (view.name === 'home'
      ? `<img class="logo" src="assets/logo.svg" alt="한입씩"><span style="flex:1"></span><button type="button" class="icon-btn" data-go="alerts" aria-label="알림 ${nAlerts}개">${ICON.bell}${nAlerts ? `<span class="count">${nAlerts}</span>` : ''}</button>`
      : `${history.length ? `<button type="button" class="icon-btn" data-act="back" aria-label="뒤로">${ICON.back}</button>` : '<span class="icon-btn"></span>'}<h1>${esc(out.title ?? '')}</h1><span class="icon-btn"></span>`);
    $('#screen').innerHTML = out.html;
    out.after?.();
  }

  document.addEventListener('click', (e) => {
    const t = /** @type {HTMLElement|null} */ (/** @type {HTMLElement} */ (e.target).closest('[data-act],[data-tab],[data-go],[data-h]'));
    if (!t) return;
    if (t.tagName === 'A') e.preventDefault();
    if (t.dataset.tab) return tabGo(t.dataset.tab);
    if (t.dataset.act === 'back') return back();
    if (t.dataset.go) return go(t.dataset.go, t.dataset.arg ?? null);
    if (t.dataset.h && handlers[t.dataset.h]) handlers[t.dataset.h](t, e);
  });
  $('#startOwn').addEventListener('click', () => { obDraft = kidDefaults({}); obKids = []; obAdults = 2; obMethod = 'both'; go('onboard', 'intro'); });

  // ---------- 공통 조각 ----------
  /** @param {() => void} [onPick] */
  function kidBar(onPick) {
    return `<div class="kidbar" role="group" aria-label="아이 선택">${state.kids.map((k, i) => `<button type="button" class="kid" aria-pressed="${k.id === currentKid().id}" data-h="${on(() => { state.selected = k.id; save(); onPick ? onPick() : render(); })}">${charHtml(i % 2 ? '당근' : '쌀', 32, 'var(--milk)')}${esc(k.name)} · ${monthsOld(k.birth)}개월</button>`).join('')}</div>`;
  }
  /** @param {Recipe} r @param {Kid|undefined} kid @param {string} [extra] @param {string} [method] */
  function recipeItem(r, kid, extra = '', method = '') {
    const c = catOf(r.category);
    const reason = kid ? unfitReason(r, kid) : null;
    const first = kid && !reason ? firstTimeAllergens(r, kid) : [];

  /** @param {MethodId} m */

  // ---------- 홈 ----------
  SCREENS.home = () => {
    const kid = currentKid();

    const alerts = alertsFor(kid);

    const p = inPlan ? planFor(kid, day) : null;
    const fits = fitRecipes(kid).filter((r) => r.category !== '같이한입' || m >= 60);
    const dayIdx = Math.floor(TODAY.getTime() / 86400000);
    const todayRecipe = p?.recipe ?? (fits.length ? fits[dayIdx % fits.length] : null);
    const pref = state.prefs.method;
    const prefMethod = pref === 'mixed' ? 'mixed' : 'topping';
    const notStarted = m < 12 && !kid.started;
    const lead = todayRecipe ? leadIngredient(todayRecipe) : '쌀';
    const stageCat = m < 7 ? '첫한입_초기' : m < 9 ? '첫한입_중기' : m < 12 ? '첫한입_후기' : '첫한입_완료기';
    const soon = fridgeSoon();
    const usableFridge = state.fridge.filter((f) => useBy(f)?.tone !== 'over');
    const fridgeCan = usableFridge.length ? fits.filter((r) => r.main_ingredients.every((i) => (i === '쌀' && state.today.riceAtHome) || usableFridge.some((f) => f.name === i))).length : 0;
    /** @param {string} cat */
    const toCat = (cat) => on(() => { rq.cat = cat; rq.q = ''; rq.onlyFit = true; tabGo('recipes'); });
    const status = notStarted ? `${esc(kid.name)} · 이유식 시작 전` : kid.started && kid.startDate && m < 12 ? `이유식 ${daysSince(kid.startDate) + 1}일차` : esc(kid.name);
    return {
      html: `${kidBar()}
        <h2 style="font-size:30px;padding-top:2px">오늘은 뭐 먹지?</h2>
        <button type="button" class="ritem" style="min-height:64px;border-radius:20px" data-tab="plan"><span class="char" style="width:48px;height:48px;background:transparent"><img src="assets/bowl.svg" alt=""></span><span><span class="t">${status}</span><span class="muted">${esc(stageLabel(kid))} · 생후 ${m}개월</span></span>${ICON.chev}</button>
        ${notStarted
          ? `<section class="banner" style="min-height:188px" aria-label="이유식 시작"><img class="deco" src="assets/rice.svg" alt="" style="width:140px;top:12px;right:-8px;transform:none"><h2 style="font-size:26px;padding-right:110px">이유식,<br>시작해 볼까요?</h2><p style="padding-right:110px">준비 신호부터 함께 확인해요.</p><div><button type="button" class="btn small" data-go="guide">이유식 처음이라면?</button></div></section>`
          : todayRecipe ? `<section class="banner" style="min-height:188px" aria-label="오늘의 첫한입">
            <img class="deco" src="assets/${CHAR[lead] ?? 'bowl'}.svg" alt="" style="width:150px;top:6px;right:-10px;transform:none">

          </section>` : `<div class="card empty"><img src="assets/rice.svg" alt=""><div>조건에 맞는 레시피가 없어요.</div></div>`}
        ${a0 ? `<button type="button" class="ritem" style="background:${a0.tone === 'warn' ? 'var(--warn-bg)' : 'var(--sage-tint)'};border:0" data-go="${a0.go?.[0] ?? 'alerts'}" ${a0.go?.[1] ? `data-arg="${esc(a0.go[1])}"` : ''}><span class="char" style="width:40px;height:40px;background:var(--white);border-radius:50%">${ICON.bell}</span><span><span class="t" style="font-size:15px">${esc(a0.title)}</span><span class="muted">${alerts.length > 1 ? `알림 ${alerts.length}개 · ` : ''}눌러서 보기</span></span>${ICON.chev}</button>` : ''}
        <div class="cats" role="group" aria-label="카테고리">
          <button type="button" class="ig card" style="padding:12px 4px;border-radius:22px" data-h="${toCat(stageCat)}"><img src="assets/cat-first.svg" alt="" style="width:56px;height:56px"><span style="font-family:var(--f-display);font-size:16px">첫한입</span><span class="muted" style="font-size:11.5px">이유식</span></button>
          <button type="button" class="ig card" style="padding:12px 4px;border-radius:22px" data-h="${toCat('쑥쑥한입')}"><img src="assets/cat-grow.svg" alt="" style="width:56px;height:56px"><span style="font-family:var(--f-display);font-size:16px">쑥쑥한입</span><span class="muted" style="font-size:11.5px">유아식 · 반찬</span></button>
          <button type="button" class="ig card" style="padding:12px 4px;border-radius:22px" data-h="${toCat('같이한입')}"><img src="assets/cat-family.svg" alt="" style="width:56px;height:56px"><span style="font-family:var(--f-display);font-size:16px">같이한입</span><span class="muted" style="font-size:11.5px">가족 식탁</span></button>
        </div>
        <button type="button" class="ritem" style="min-height:76px;border:0;border-radius:24px;background:var(--mist)" data-go="myfridge"><span class="char" style="width:54px;height:54px;background:transparent"><img src="assets/fridge.svg" alt=""></span><span><span class="t" style="font-size:18px">냉장고에 뭐 있지?</span><span style="font-size:12.5px;color:#3F5560">${soon.length ? `곧 써야 해요: ${soon.slice(0, 3).map((f) => esc(f.name)).join(', ')}` : state.fridge.length ? `재료 ${state.fridge.length}개 · 바로 만들 수 있는 레시피 ${fridgeCan}개` : '재료를 넣으면 보관법과 레시피를 알려 드려요'}</span></span>${ICON.chev}</button>
        <div class="row" style="justify-content:center;gap:4px 14px;font-size:13.5px;padding-bottom:4px">
          <a href="#" data-go="guide">이유식 처음이라면?</a><a href="#" data-go="allergy">알레르기 식품</a><a href="#" data-go="today">재료로 찾기</a><a href="#" data-go="family">온 가족 레시피</a><a href="#" data-go="situations">이럴 땐 이렇게</a>
        </div>`,
    };
  };

  SCREENS.today = () => ({ title: '재료로 찾기', html: `${kidBar()}${whatToEat(currentKid())}`, after: bindWhatToEat });

  // 재료 이름 추천 버튼. 브라우저 기본 자동완성(datalist)은 일부 모바일에서 한글 조합을 끊어서 쓰지 않는다.
  // 입력 칸은 건드리지 않고 아래 버튼 목록만 바꾼다.
  /** @param {HTMLInputElement} input @param {HTMLElement} box @param {string[]} names @param {(name: string) => void} onPick */
  function attachSuggest(input, box, names, onPick) {
    const show = () => {
      const last = input.value.split(/[,，]/).pop()?.trim() ?? '';
      const hits = last ? names.filter((n) => n.includes(last) && n !== last).slice(0, 8) : [];
      box.innerHTML = hits.map((n) => `<button type="button" class="badge" style="min-height:34px;border:1.5px solid var(--line);background:var(--white)" data-s="${esc(n)}">${esc(n)}</button>`).join('');
    };
    const later = debounce(show, 250);
    input.addEventListener('input', later);
    input.addEventListener('compositionend', later);
    box.addEventListener('click', (e) => {
      const b = /** @type {HTMLElement|null} */ (/** @type {HTMLElement} */ (e.target).closest('[data-s]'));
      if (b?.dataset.s) onPick(b.dataset.s);
    });
    show();
  }

  // 오늘 뭐 먹지: 오늘 쓸 수 있는 재료로 추천
  let todayDraft = '';
  const allIngredients = () => [...new Set([...GUIDE_ROWS.flatMap((g) => String(g['재료']).split('/')), ...RECIPES.flatMap((r) => r.main_ingredients)])].sort((a, b) => a.localeCompare(b, 'ko'));
  /** @param {Kid} kid */
  function whatToEat(kid) {
    const t = state.today;
    const have = new Set([...t.items, ...(t.riceAtHome ? ['쌀'] : [])]);
    const eaters = t.family ? state.kids : [kid];
    const ok = (/** @type {Recipe} */ r) => eaters.every((k) => !unfitReason(r, k));
    const missing = (/** @type {Recipe} */ r) => r.main_ingredients.filter((i) => !have.has(i));
    const pool = t.items.length ? RECIPES.filter((r) => ok(r) && r.main_ingredients.some((i) => t.items.includes(i))) : [];
    const can = pool.filter((r) => !missing(r).length).sort((a, b) => b.main_ingredients.filter((i) => t.items.includes(i)).length - a.main_ingredients.filter((i) => t.items.includes(i)).length);
    const almost = pool.filter((r) => missing(r).length === 1);
    return `<section class="card stack" aria-label="오늘 뭐 먹지" style="background:var(--white)">
      <h2 style="font-size:24px">오늘은 뭐 먹지?</h2>
      <div class="muted">오늘 쓸 수 있는 재료를 넣으면 ${t.family ? '온 가족이' : esc(kid.name) + '가'} 먹을 수 있는 레시피를 찾아 드려요.</div>
      <div class="row" style="flex-wrap:nowrap"><input class="input" id="todayInput" type="text" placeholder="예: 소고기, 애호박" aria-label="오늘 쓸 재료" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(todayDraft)}"><button type="button" class="btn small" id="todayAdd" style="flex:none">넣기</button></div>
      <div class="row" id="todaySuggest" aria-live="polite"></div>
      ${t.items.length ? `<div class="row">${t.items.map((i) => `<span class="tag-x">${esc(i)}<button type="button" aria-label="${esc(i)} 빼기" data-h="${on(() => { t.items = t.items.filter((x) => x !== i); save(); render(); })}">${ICON.x}</button></span>`).join('')}</div>` : ''}
      ${state.fridge.length ? `<button type="button" class="btn ghost small" style="align-self:flex-start" data-h="${on(() => { t.items = [...new Set([...t.items, ...state.fridge.map((f) => f.name)])]; save(); render(); })}">우리집 냉장고 재료 불러오기 (${state.fridge.length})</button>` : ''}
      <label class="toggle"><input type="checkbox" id="riceHome" ${t.riceAtHome ? 'checked' : ''}> 쌀·밥은 집에 있어요</label>
      ${state.kids.length > 1 ? `<label class="toggle"><input type="checkbox" id="familyMode" ${t.family ? 'checked' : ''}> 온 가족 기준으로 (${state.kids.map((k) => esc(k.name)).join(', ')} 모두 먹을 수 있는 것)</label>` : ''}
      ${t.items.length ? `<div class="sec-title" style="font-size:17px">바로 만들 수 있어요 <span class="muted">${can.length}개</span></div>
        <div class="rlist">${can.slice(0, 6).map((r) => recipeItem(r, t.family ? undefined : kid)).join('') || '<div class="muted">넣은 재료만으로 되는 레시피가 아직 없어요.</div>'}</div>
        ${almost.length ? `<details class="fold"><summary>하나만 더 있으면 돼요 ${almost.length}개</summary><div class="rlist" style="margin-top:8px">${almost.slice(0, 8).map((r) => recipeItem(r, t.family ? undefined : kid, `<span class="badge warn">${esc(missing(r)[0])}만 있으면</span>`)).join('')}</div></details>` : ''}` : ''}
    </section>`;
  }
  function bindWhatToEat() {
    const input = $('#todayInput');
    if (!input) return;
    const add = () => {
      const names = String(input.value).split(/[,，\s]+/).map((s) => s.trim()).filter(Boolean);
      if (!names.length) return;
      state.today.items = [...new Set([...state.today.items, ...names])];
      todayDraft = '';
      save(); render(); $('#todayInput')?.focus();
    };
    input.addEventListener('input', () => { todayDraft = input.value; });
    attachSuggest(input, $('#todaySuggest'), allIngredients(), (name) => {
      state.today.items = [...new Set([...state.today.items, name])]; todayDraft = ''; save(); render(); $('#todayInput')?.focus();
    });
    $('#todayAdd').addEventListener('click', add);
    input.addEventListener('keydown', (/** @type {KeyboardEvent} */ e) => { if (e.key === 'Enter' && !imeBusy(e)) { e.preventDefault(); add(); } });
    $('#riceHome').addEventListener('change', (/** @type {any} */ e) => { state.today.riceAtHome = e.target.checked; save(); render(); });
    $('#familyMode')?.addEventListener('change', (/** @type {any} */ e) => { state.today.family = e.target.checked; save(); render(); });
  }

  // ---------- 알림 ----------

    const kid = currentKid();

    return {
      title: '알림',
      html: `${kidBar()}<div class="muted">앱 안에서만 보이는 알림이에요. 휴대폰 푸시 알림은 아직 없어요.</div>
        <div class="rlist">${list.map((a) => `<button type="button" class="card alert-item" style="text-align:left;background:${a.tone === 'warn' ? 'var(--warn-bg)' : a.tone === 'sage' ? 'var(--sage-tint)' : 'var(--butter)'};border:0" ${a.go ? `data-go="${a.go[0]}" ${a.go[1] ? `data-arg="${esc(a.go[1])}"` : ''}` : ''}><span style="flex:1;min-width:0"><b style="display:block">${esc(a.title)}</b><span style="font-size:13.5px">${esc(a.body)}</span></span>${ICON.chev}</button>`).join('') || '<div class="empty"><img src="assets/rice.svg" alt="">지금은 알림이 없어요.</div>'}</div>

        </section>`,
    };
  };

  // ---------- 첫한입 가이드 ----------
  SCREENS.guide = () => ({
    title: '이유식 처음이라면?',
    html: `<div class="hero" style="height:150px;background:var(--butter)"><img src="assets/rice.svg" alt="" style="left:50%;top:22px;width:104px;transform:translateX(-50%)"><img src="assets/zucchini.svg" alt="" style="left:18px;bottom:8px;width:72px;transform:rotate(-8deg)"><img src="assets/carrot.svg" alt="" style="right:18px;bottom:6px;width:72px;transform:rotate(8deg)"></div>
      <div><h2 style="font-size:24px">처음 이유식, 순서대로 볼까요?</h2><div class="muted">하나씩 눌러 보세요. 안전 정보는 공식 기관 원문을 확인해 한입씩이 새로 쓴 문장이에요.</div></div>
      <div class="steps-nav">
        <button type="button" data-go="readiness"><span class="num">1</span><span style="flex:1"><b style="display:block">우리 아기 이유식 시작해도 될까?</b><span class="muted">준비 신호 체크리스트</span></span>${ICON.chev}</button>
        <button type="button" data-go="stages"><span class="num">2</span><span style="flex:1"><b style="display:block">이유식 단계별 안내</b><span class="muted">초기 · 중기 · 후기 · 완료기</span></span>${ICON.chev}</button>
        <button type="button" data-go="faq"><span class="num">3</span><span style="flex:1"><b style="display:block">처음 이유식 시작하기</b><span class="muted">첫 음식, 간격, 양, 보관 등 10가지 질문</span></span>${ICON.chev}</button>

      html: `<div><h2 style="font-size:24px">${esc(g.title)}</h2><p class="muted" style="margin-top:6px">${esc(g.lead)}</p></div>
        <section class="card" aria-label="준비 신호 체크리스트">${g.checklist.map((c) => `<div class="check"><input type="checkbox" id="rc_${c.id}" ${readyChecks[c.id] ? 'checked' : ''} data-h="${on(() => { readyChecks[c.id] = !readyChecks[c.id]; render(); })}"><label for="rc_${c.id}"><b>${esc(c.text)}</b><span class="muted">${esc(c.detail)}</span></label></div>`).join('')}

        <div class="note warn">${ICON.info}<span>${esc(g.consult.text)}${cite(g.consult.sources)}</span></div>
        <div class="muted">이 체크리스트는 진단 기능이 아니에요. 걱정되는 점은 소아청소년과와 상의해 주세요.</div>
        <button type="button" class="btn block" data-go="stages">다음: 단계별 안내</button>`,
    };

  let stageTab = 'early';

    const s = GUIDE.stages.find((x) => x.id === stageTab) ?? GUIDE.stages[0];
